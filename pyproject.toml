[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinpoint"
version = "0.1.0"
description = "An AI overseer that pinpoints the exact step proving an agent misbehaved."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manas Mehta" }]
dependencies = [
  "openai>=1.40,<3",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.scripts]
pinpoint = "pinpoint.cli:main"

[project.optional-dependencies]
# GroundingBench (prior work) supplies the evaluation traces and the reference
# grader, pinned to an exact public commit. Only benchmark/ may use it: the
# pinpoint package itself must never see ground-truth labels, so this is an
# optional extra rather than a core dependency.
eval = [
  "grounding-bench @ git+https://github.com/ManasMehta1110/GroundingBench@5fd7325d807e0128e330391244ee36023056e012",
]
# The demo web app (app/): a small API over the pinpoint package.
app = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29",
]
# Real agent runs (benchmark/agent.py): tools execute in Modal sandboxes.
agent = [
  "modal>=1.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["pinpoint*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["pinpoint", "benchmark", "app", "tests"]
enable_error_code = ["possibly-undefined"]

# GroundingBench (prior work) ships no type information. Only benchmark/
# imports it; values it returns are converted at the boundary.
[[tool.mypy.overrides]]
module = ["env.*", "doers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
